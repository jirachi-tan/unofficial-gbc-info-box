name: Test Notion V2 Access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test full Notion data sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN_V2 }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
        run: |
          node scripts/fetch-notion.mjs
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const rows = JSON.parse(readFileSync('public/data/events.json', 'utf8'));
            if (!Array.isArray(rows) || rows.length === 0) {
              throw new Error('No event data retrieved');
            }
            console.log('Validated rows:', rows.length);
          "